name: testes

on:
  push:
    branches: ["produção", "homologação"]
  pull_request:
  workflow_dispatch:

jobs:
  postgresql:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "16", "18"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lojateste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: lojateste

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar o driver
        run: python -m pip install --quiet "psycopg[binary]"

      - name: instalar o guarda
        run: |
          for etapa in 01-base 02-guardas-dml 03-guardas-ddl 04-instalador; do
            echo "::group::$etapa"
            psql -v ON_ERROR_STOP=1 -q -f "postgresql/$etapa.sql"
            echo "::endgroup::"
          done

      - name: teste de aceitação no banco
        run: |
          set -o pipefail
          psql -f postgresql/90-teste-aceitacao.sql | tee resultado.txt
          if grep -q "FALHOU" resultado.txt; then
            echo "::error::o teste de aceitação reprovou"
            exit 1
          fi
          grep -E "^ *[0-9]+ \| *[0-9]+$" resultado.txt || true

      - name: testes de unidade do linter
        working-directory: lint
        run: python -m unittest test_guarda_lint -v

      - name: linter sobre o próprio SQL do projeto
        run: python lint/guarda_lint.py --so-erros postgresql sqlserver mysql

      - name: testes do painel
        working-directory: painel
        run: python -m unittest test_painel -v

      - name: teste de integração do painel e do watchdog
        working-directory: painel
        env:
          GUARDA_DSN: "host=127.0.0.1 port=5432 dbname=lojateste user=postgres password=postgres"
        run: python -m unittest test_integracao -v

      - name: watchdog não acusa nada num banco íntegro
        env:
          GUARDA_DSN: "host=127.0.0.1 port=5432 dbname=lojateste user=postgres password=postgres"
        run: python ferramentas/rearmar.py --engine postgresql --conferir

  mysql:
    name: MySQL 8.4
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # O contêiner é subido na mão, e não com services, para poder usar o
      # cliente mysql de dentro dele. O runner do Ubuntu traz o cliente do
      # MariaDB, que não fecha handshake com o MySQL 8.4 e falha com
      # "Lost connection at reading initial communication packet".
      - name: subir o MySQL
        run: |
          docker run -d --name guardamysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -p 3306:3306 mysql:8.4
          # Espera por uma consulta autenticada, não por mysqladmin ping. O
          # entrypoint do MySQL sobe um servidor temporário antes de definir
          # a senha do root, e nessa janela o ping responde mas a conexão com
          # senha ainda dá "Access denied".
          for tentativa in $(seq 1 60); do
            if docker exec guardamysql mysql -uroot -proot -e "select 1" > /dev/null 2>&1; then
              echo "servidor pronto e autenticando na tentativa $tentativa"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' guardamysql)" != "true" ]; then
              echo "::error::o contêiner do MySQL morreu"
              docker logs guardamysql | tail -30
              exit 1
            fi
            sleep 2
          done
          echo "::error::o MySQL não ficou pronto em 120 segundos"
          docker logs guardamysql | tail -30
          exit 1

      - name: instalar o guarda
        run: |
          for etapa in 01-base 02-servidor 03-gerador-triggers; do
            echo "::group::$etapa"
            docker exec -i guardamysql mysql -uroot -proot < "mysql/$etapa.sql"
            echo "::endgroup::"
          done

      - name: diagnóstico
        run: docker exec guardamysql mysql -uroot -proot -e "CALL guarda.diagnostico()"

      - name: teste de aceitação no banco
        run: |
          set -o pipefail
          docker exec -i guardamysql mysql -uroot -proot < mysql/90-teste-aceitacao.sql | tee resultado.txt
          if grep -q "FALHOU" resultado.txt; then
            echo "::error::o teste de aceitação reprovou"
            exit 1
          fi

      # O MySQL não tem trigger de DDL: tabela criada depois da instalação
      # nasce desprotegida. Quem fecha esse buraco é o watchdog, e é aqui
      # que se prova que ele fecha mesmo.
      - name: watchdog adota tabela criada depois da instalação
        run: |
          set -e
          python -m pip install --quiet PyMySQL

          M="docker exec -i guardamysql mysql -uroot -proot"
          $M -e "CREATE DATABASE IF NOT EXISTS loja;
                 CREATE TABLE loja.pedido (id INT PRIMARY KEY, valor DECIMAL(10,2));
                 INSERT INTO loja.pedido VALUES (1, 10), (2, 20);"

          echo "::group::sem o watchdog, a tabela esta desprotegida"
          $M -e "SELECT COUNT(*) AS triggers_na_tabela FROM information_schema.TRIGGERS
                  WHERE EVENT_OBJECT_SCHEMA='loja' AND EVENT_OBJECT_TABLE='pedido';"
          $M -e "SELECT COUNT(*) AS tabelas_sem_protecao FROM guarda.sem_protecao;"
          echo "::endgroup::"

          export GUARDA_DSN="host=127.0.0.1 port=3306 user=root password=root dbname=guarda"

          # --conferir tem que acusar e sair com 1, sem consertar
          set +e
          python ferramentas/rearmar.py --engine mysql --conferir
          codigo=$?
          set -e
          if [ "$codigo" != "1" ]; then
            echo "::error::--conferir deveria ter saido com 1, saiu com $codigo"
            exit 1
          fi

          # agora conserta de verdade
          set +e
          python ferramentas/rearmar.py --engine mysql
          codigo=$?
          set -e
          if [ "$codigo" != "1" ]; then
            echo "::error::o rearme deveria ter saido com 1, saiu com $codigo"
            exit 1
          fi

          # e a segunda passada nao acha mais nada
          python ferramentas/rearmar.py --engine mysql --conferir

          echo "::group::depois do watchdog"
          $M -e "SELECT TRIGGER_NAME FROM information_schema.TRIGGERS
                  WHERE EVENT_OBJECT_SCHEMA='loja' AND EVENT_OBJECT_TABLE='pedido';"
          echo "::endgroup::"

          faltando=$($M -sN -e "SELECT COUNT(*) FROM guarda.sem_protecao;")
          if [ "$faltando" != "0" ]; then
            echo "::error::ainda ha $faltando tabela(s) sem protecao depois do rearme"
            exit 1
          fi

      - name: watchdog deixa rastro na auditoria
        run: |
          docker exec -i guardamysql mysql -uroot -proot -e \
            "SELECT comando, justificativa, aplicacao FROM guarda.evento
              WHERE aplicacao = 'guarda-rearmar' ORDER BY id DESC LIMIT 3;"
